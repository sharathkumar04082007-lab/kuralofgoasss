version: '3.8'

services:
  # Optional standalone Qdrant Vector Database instance
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: voicerag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

  # Main Voice-Enabled RAG Backend & Frontend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voicerag-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - QDRANT_MODE=remote
      - QDRANT_URL=http://qdrant:6333
      - STT_PROVIDER=sarvam
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - EMBEDDING_MODEL_NAME=sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
    volumes:
      - ./data:/app/data
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_data:
